name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go: [ "1.26", "1.27" ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Linting
        if: matrix.go == '1.27'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    # All runs share one Dropbox account: never run two at once
    concurrency:
      group: dropbox-live-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # Tests that need a real Dropbox account are skipped when DROPBOX_TOKEN is absent (PRs from bots)
      - name: Test
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
        run: go test -parallel 20 -race -coverprofile=coverage.txt -covermode=atomic ./...

  # For github to have a unique status check name
  build-status:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All good'
